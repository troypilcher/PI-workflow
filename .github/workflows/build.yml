name: Build Desktop Apps (Win + Mac)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Ensure config exists
        shell: bash
        run: |
          if [ ! -f "config.json" ]; then
            cp "config.example.json" "config.json"
          fi

      - name: Install pkg
        run: npm install -g pkg

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pkg index.js --targets node18-win-x64 --output FileBackupManager.exe

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: pkg index.js --targets node18-macos-x64 --output FileBackupManager-mac

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FileBackupManager-Windows
          path: FileBackupManager.exe

      - name: Upload (Mac)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FileBackupManager-Mac
          path: FileBackupManager-mac
